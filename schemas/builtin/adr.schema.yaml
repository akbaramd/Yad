id: adr
version: 1
title: Architecture Decision Record
abbreviation: ADR
category: architecture
description: Records a significant architecture decision, why it was made, and its consequences.
standard: ADR (de facto architecture decision record practice)
aliases: [architecture-decision, decision-record]
id_prefix: ADR
directory: adr
initial_status: proposed
statuses: [proposed, accepted, rejected, deprecated, superseded]
historical_statuses: [rejected, deprecated, superseded]
authoritative_statuses: [accepted]
transitions:
  proposed: [accepted, rejected]
  accepted: [deprecated, superseded]
  rejected: []
  deprecated: []
  superseded: []
sections:
  - { key: context, title: Context, required: true, description: The forces, constraints, and problem that require a decision. }
  - { key: decision, title: Decision, required: true, description: The decision that was made. }
  - { key: consequences, title: Consequences, required: true, description: Positive, negative, and neutral consequences of the decision. }
  - { key: alternatives, title: Alternatives Considered, required: false, description: Relevant alternatives and why they were not selected. }
  - { key: references, title: References, required: false, description: Related records, specifications, code, issues, or external references. }
